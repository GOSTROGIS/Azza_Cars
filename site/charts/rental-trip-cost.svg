n. No Day Tripper rate for Oversized.</title><rect x="330.0" y="414.0" width="311.0" height="20.0" rx="4" fill="#eee8dc"/></g><text x="649.0" y="427.0" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#9a958c">C$61.00</text><text x="318.0" y="457.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#f7f4ee">Home Depot, large cargo van</text><g><title>Home Depot, large cargo van: C$94.00. National price page, Surrey store not confirmed. Unlimited km. Rounded up to the next published tier.</title><rect x="330.0" y="444.0" width="479.3" height="20.0" rx="4" fill="#eee8dc"/></g><text x="817.3" y="457.0" text-anchor="start" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#9a958c">C$94.00</text></svg>
