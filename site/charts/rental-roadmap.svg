 Surrey cash-positive 6 months</title><path d="M780.0,53 l7,7 l-7,7 l-7,-7 z" fill="#f7f4ee" stroke="#111112" stroke-width="2"/></g><text x="368.0" y="77.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#f7f4ee">Set-up: insurance, licences, site, fleet</text><g><title>A. Counter first (recommended): Set-up: insurance, licences, site, fleet, month -6 to 0</title><rect x="380.0" y="65" width="98.0" height="16" rx="4" fill="#ff4b1f"/></g><text x="368.0" y="103.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#f7f4ee">Staffed Surrey counter, vans, pickups, trucks, cars</text><g><title>A. Counter first (recommended): Staffed Surrey counter, vans, pickups, trucks, cars, month 0 to 12</title><rect x="480.0" y="91" width="198.0" height="16" rx="4" fill="#ff4b1f"/></g><text x="368.0" y="129.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#f7f4ee">Trade accounts and monthly van hire</text><g><title>A. Counter first (recommended): Trade accounts and monthly van hire, month 3 to 24</title><rect x="530.0" y="117" width="348.0" height="16" rx="4" fill="#ff4b1f"/></g><text x="368.0" y="155.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#f7f4ee">After-hours key boxes, then app self-service</text><g><title>A. Counter first (recommended): After-hours key boxes, then app self-service, month 9 to 24</title><rect x="630.0" y="143" width="248.0" height="16" rx="4" fill="#ff4b1f"/></g><text x="368.0" y="181.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#f7f4ee">Second site, Langley Township</text><g><title>A. Counter first (recommended): Second site, Langley Township, month 18 to 30</title><rect x="780.0" y="169" width="198.0" height="16" rx="4" fill="#ff4b1f"/></g><text x="0.0" y="219.0" text-anchor="start" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#f7f4ee">B. Self-service van share</text><g><title>Gate at month 9: Damage and no-show costs within budget</title><path d="M630.0,221 l7,7 l-7,7 l-7,-7 z" fill="#f7f4ee" stroke="#111112" stroke-width="2"/></g><text x="368.0" y="245.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#f7f4ee">Set-up plus telematics and remote ID checks</text><g><title>B. Self-service van share: Set-up plus telematics and remote ID checks, month -6 to 0</title><rect x="380.0" y="233" width="98.0" height="16" rx="4" fill="#6f8fd0"/></g><text x="368.0" y="271.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#f7f4ee">24/7 app pickup at one Surrey lot, vans and pickups</text><g><title>B. Self-service van share: 24/7 app pickup at one Surrey lot, vans and pickups, month 0 to 12</title><rect x="480.0" y="259" width="198.0" height="16" rx="4" fill="#6f8fd0"/></g><text x="368.0" y="297.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#f7f4ee">Hourly stations where no car share runs (Langley, White Rock)</text><g><title>B. Self-service van share: Hourly stations where no car share runs (Langley, White Rock), month 9 to 24</title><rect x="630.0" y="285" width="248.0" height="16" rx="4" fill="#6f8fd0"/></g><text x="0.0" y="335.0" text-anchor="start" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#f7f4ee">C. Fleet-light</text><g><title>Gate at month 12: ICBC, PVRT and Surrey licence answers in writing</title><path d="M680.0,337 l7,7 l-7,7 l-7,-7 z" fill="#f7f4ee" stroke="#111112" stroke-width="2"/></g><text x="368.0" y="361.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#f7f4ee">Own fleet on Turo, winter idle days</text><g><title>C. Fleet-light: Own fleet on Turo, winter idle days, month 0 to 6</title><rect x="480.0" y="349" width="98.0" height="16" rx="4" fill="#b08a3a"/></g><text x="368.0" y="387.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#f7f4ee">Owner-supplied vehicles under Ember Rent's brand</text><g><title>C. Fleet-light: Owner-supplied vehicles under Ember Rent's brand, month 12 to 30</title><rect x="680.0" y="375" width="298.0" height="16" rx="4" fill="#b08a3a"/></g></svg>
